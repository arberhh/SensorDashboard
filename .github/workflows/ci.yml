name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The RN app in apps/rn-sensor-dashboard.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rn-sensor-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches package.json's engines field (>= 22.11.0) — bumped
          # from 20 because @testing-library/react-native and its
          # test-renderer peer (added for ARB-11) require Node
          # ^22.13.0 || >=24.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rn-sensor-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: the remaining findings are all pinned to a
      # react-native 0.87.0 -> 0.84.1 downgrade (a semver-major step
      # backwards), which npm audit suggests because advisory metadata
      # for this RN line hasn't caught up yet. Revisit when upstream
      # publishes a real fix instead of a downgrade.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npm run ts:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --ci

      - name: Dead code / unused exports / unused deps
        run: npm run deadcode

  # The Rust backend in server/. Independent of the Node checks above, so
  # it runs in parallel.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Native builds are slower and usually gated separately (nightly, or
  # only on release branches) rather than on every PR — add jobs like
  # the ones below only if the project wants build verification in CI,
  # not as a default. They need macos-latest (iOS) and a JDK setup
  # (Android) that the checks job above doesn't.
  #
  # android-build:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: "17" }
  #     - run: cd apps/rn-sensor-dashboard/android && ./gradlew assembleDebug
  #
  # ios-build:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: cd apps/rn-sensor-dashboard/ios && pod install
  #     - run: xcodebuild -workspace apps/rn-sensor-dashboard/ios/*.xcworkspace -scheme <Scheme> -configuration Debug -sdk iphonesimulator build
